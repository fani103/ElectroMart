<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · ElectroMart</title>
<meta name="description" content="ElectroMart - genuine electronics at honest prices.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-page="forgot" data-nav="">
<main class="auth-wrap"><div class="auth-card"><h1 id="forgot-title">Forgot your password?</h1><p class="sub">Enter your email and we will send you a reset link.</p>
<div id="auth-alert" class="alert" style="display:none" role="alert"></div>
<form id="forgot-form" novalidate><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err"></div></div><button class="btn btn-primary btn-block" type="submit">Send reset link</button></form>
<form id="reset-form" style="display:none" novalidate><div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" required><div class="err"></div></div>
<div class="field"><label for="confirm">Confirm new password</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required><div class="err"></div></div><button class="btn btn-primary btn-block" type="submit">Update password</button></form>
<p class="auth-foot"><a href="signin.html">← Back to sign in</a></p></div></main>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/cart.js"></script>
</body>
</html>
