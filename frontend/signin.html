<body data-page="signin" data-nav="">
<main class="auth-wrap"><div class="auth-card"><h1>Welcome back</h1><p class="sub">Sign in to continue to checkout and your orders.</p>
<div id="auth-alert" class="alert" style="display:none" role="alert"></div><button type="button" class="btn google-btn btn-block" id="google-btn"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg> Continue with Google</button><div class="divider">or</div>
<form id="signin-form" novalidate><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><div class="err"></div></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><div class="err"></div></div>
<p style="text-align:right;margin:-6px 0 12px;font-size:.85rem"><a href="forgot-password.html">Forgot password?</a></p><button class="btn btn-primary btn-block" type="submit">Sign in</button></form>
<p class="auth-foot">New here? <a href="signup.html" data-keep-redirect>Create an account</a></p><a class="admin-link" href="admin.html">🛡️ Admin? Go to Admin Dashboard →</a></div></main>
